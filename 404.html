<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07111f">
  <title>404 — Page not found</title>
  <style>
    :root {
      --ink: #eef7ff;
      --muted: #9eb4c9;
      --cyan: #65e6ff;
      --violet: #9d7cff;
      --panel: rgba(12, 29, 49, .76);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #07111f;
    }

    .scene {
      position: relative;
      display: grid;
      min-height: 100vh;
      place-items: center;
      isolation: isolate;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 44%, rgba(57, 111, 171, .22), transparent 30rem),
        linear-gradient(135deg, #07111f 0%, #0b1930 52%, #12152e 100%);
    }

    .scene::before {
      content: "";
      position: absolute;
      inset: -30%;
      z-index: -1;
      opacity: .5;
      background-image: linear-gradient(rgba(101, 230, 255, .07) 1px, transparent 1px), linear-gradient(90deg, rgba(101, 230, 255, .07) 1px, transparent 1px);
      background-size: 64px 64px;
      transform: perspective(420px) rotateX(62deg) translateY(25%);
      animation: gridMove 16s linear infinite;
    }

    .orb { position: absolute; border-radius: 50%; filter: blur(3px); pointer-events: none; }
    .orb.one { width: 20rem; height: 20rem; top: -8rem; right: 8%; background: rgba(157, 124, 255, .13); animation: drift 8s ease-in-out infinite; }
    .orb.two { width: 14rem; height: 14rem; bottom: -5rem; left: 8%; background: rgba(101, 230, 255, .12); animation: drift 10s ease-in-out -3s infinite; }

    .content {
      width: min(90%, 760px);
      padding: 2.6rem 2rem;
      text-align: center;
      border: 1px solid rgba(160, 219, 255, .2);
      border-radius: 28px;
      background: var(--panel);
      box-shadow: 0 28px 90px rgba(0, 0, 0, .42), inset 0 1px rgba(255,255,255,.08);
      backdrop-filter: blur(16px);
      animation: enter .8s ease-out both;
    }

    .code { margin: 0; color: var(--cyan); font-size: clamp(5rem, 18vw, 10rem); line-height: .8; letter-spacing: -.09em; font-weight: 900; text-shadow: 0 0 35px rgba(101, 230, 255, .35); }
    h1 { margin: 1.8rem 0 .65rem; font-size: clamp(1.45rem, 4vw, 2.2rem); }
    p { max-width: 31rem; margin: 0 auto 1.7rem; color: var(--muted); line-height: 1.7; }
    .home { display: inline-block; padding: .85rem 1.25rem; color: #07111f; font-weight: 800; text-decoration: none; border-radius: 999px; background: linear-gradient(100deg, var(--cyan), #b9f6ff); transition: transform .2s, box-shadow .2s; }
    .home:hover, .home:focus-visible { transform: translateY(-3px); box-shadow: 0 10px 25px rgba(101, 230, 255, .25); }

    .desk { position: absolute; z-index: -1; width: min(82vw, 660px); height: 210px; bottom: -55px; border-radius: 50%; background: radial-gradient(ellipse, rgba(101, 230, 255, .12), transparent 68%); filter: blur(2px); }
    .laptop, .mouse { position: absolute; z-index: -1; opacity: .32; filter: drop-shadow(0 0 18px rgba(101, 230, 255, .25)); }
    .laptop { width: 300px; height: 210px; left: 7%; bottom: 7%; animation: laptopFloat 6s ease-in-out infinite; }
    .screen { position: absolute; width: 210px; height: 140px; left: 35px; top: 0; padding: 10px; border: 8px solid #9bbbd0; border-bottom-width: 13px; border-radius: 12px 12px 4px 4px; background: #081524; transform: skewY(-4deg); }
    .screen::after { content: ""; display: block; width: 55%; height: 7px; margin: 22px auto; border-radius: 8px; background: linear-gradient(90deg, var(--cyan), var(--violet)); box-shadow: 0 18px 0 #34546b, 0 36px 0 #34546b; }
    .base { position: absolute; bottom: 0; width: 300px; height: 30px; border-radius: 5px 5px 25px 25px; background: linear-gradient(#adcddd, #58758b); transform: perspective(90px) rotateX(22deg); }
    .base::after { content: ""; position: absolute; width: 75px; height: 6px; left: 112px; top: 8px; border-radius: 5px; background: #34546b; }
    .mouse { width: 67px; height: 92px; right: 12%; bottom: 10%; border: 7px solid #9bbbd0; border-radius: 48% 48% 45% 45%; background: #19344a; transform: rotate(-20deg); animation: mouseMove 7s ease-in-out infinite; }
    .mouse::before { content: ""; position: absolute; width: 3px; height: 27px; top: -3px; left: 26px; background: var(--cyan); }
    .mouse::after { content: ""; position: absolute; width: 2px; height: 50px; right: -35px; top: -35px; border: 2px solid rgba(155,187,208,.75); border-left: 0; border-bottom: 0; border-radius: 0 45px 0 0; transform: rotate(20deg); }

    @keyframes gridMove { to { transform: perspective(420px) rotateX(62deg) translateY(31%); } }
    @keyframes enter { from { opacity: 0; transform: translateY(18px) scale(.98); } to { opacity: 1; transform: none; } }
    @keyframes drift { 50% { transform: translate(28px, 20px) scale(1.08); } }
    @keyframes laptopFloat { 50% { transform: translateY(-14px) rotate(1deg); } }
    @keyframes mouseMove { 0%, 100% { transform: translate(0, 0) rotate(-20deg); } 50% { transform: translate(-34px, -18px) rotate(-15deg); } }
    @media (max-width: 600px) { .laptop { transform: scale(.7); left: -25px; } .mouse { transform: scale(.72) rotate(-20deg); right: 1%; } .content { padding: 2rem 1.2rem; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; } }
  </style>
</head>
<body>
  <main class="scene">
    <span class="orb one"></span><span class="orb two"></span>
    <div class="desk"></div>
    <div class="laptop" aria-hidden="true"><div class="screen"></div><div class="base"></div></div>
    <div class="mouse" aria-hidden="true"></div>
    <section class="content" aria-labelledby="title">
      <div class="code">404</div>
      <h1 id="title">Looks like this page wandered off.</h1>
      <p>The page you’re looking for doesn’t exist or may have moved somewhere else.</p>
      <a class="home" href="/">Back to home</a>
    </section>
  </main>
</body>
</html>
